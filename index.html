<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEN SYSTEM - La Via della Maestria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --zen-green: #60806b; 
            --zen-light-green: #9eb5a5; 
            --zen-bg: #faf7f2; 
            --zen-panel: #ffffff;
            --zen-text: #4a4a4a;
            --zen-accent: #c49667; 
            --zen-fire: #d46b53; 
            --zen-lavender: #b5a4bf;
        }

        body {
            background-color: var(--zen-bg);
            color: var(--zen-text);
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            padding-bottom: 30px;
        }

        .system-panel {
            background: var(--zen-panel);
            border: 1px solid #efeae0;
            box-shadow: 0 12px 30px rgba(96, 128, 107, 0.08);
            border-radius: 16px;
        }

        .system-header {
            border-bottom: 2px solid var(--zen-light-green);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            color: var(--zen-green);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .stat-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 0; border-bottom: 1px solid #f5f5f5;
        }

        .btn-system {
            background: transparent; border: 2px solid var(--zen-green);
            color: var(--zen-green); text-transform: uppercase; font-weight: bold;
            border-radius: 30px; transition: all 0.3s ease; cursor: pointer;
        }

        .btn-system:hover:not(:disabled) {
            background: var(--zen-green); color: #fff;
        }

        .info-btn { color: #a0aec0; cursor: pointer; }
        .info-btn:hover { color: var(--zen-green); }

        .timer-active-box {
            background-color: #f0fdf4; border: 2px solid #bbf7d0;
            border-radius: 12px; padding: 0.75rem 1rem;
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }

        .modal-overlay {
            background: rgba(250, 247, 242, 0.9); position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .hidden { display: none !important; }
        .progress-fill { background: var(--zen-green); border-radius: 6px; }
        .progress-fire { background: var(--zen-fire); border-radius: 6px; }
        .progress-bg { background: #e8e8e8; border-radius: 6px; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <audio id="sfx-level-up" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sfx-start-chime" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

    <div id="toast-container" class="fixed top-5 right-5 z-[100]"></div>

    <div class="w-full max-w-2xl flex justify-between items-center mb-4">
        <button onclick="toggleSettings()" class="text-sm font-bold text-gray-400 hover:text-gray-700">
            <i class="fas fa-cog"></i> SISTEMA
        </button>
    </div>

    <div id="settings-panel" class="w-full max-w-2xl system-panel p-5 mb-4 hidden">
        <h2 class="text-lg text-gray-700 border-b mb-4 pb-2 font-bold">Backup Maestria</h2>
        <div class="flex flex-col gap-3">
            <button onclick="exportData()" class="btn-system py-2 text-sm">Esporta Dati</button>
            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
            <button onclick="document.getElementById('import-file').click()" class="btn-system py-2 text-sm" style="border-color: var(--zen-accent); color: var(--zen-accent);">Importa Backup</button>
        </div>
    </div>

    <div id="main-container" class="w-full max-w-2xl">
        <div class="system-panel p-6 mb-6">
            <h1 class="text-2xl font-black text-center text-gray-700 mb-6 tracking-widest">VIA DELLA MAESTRIA</h1>
            <div class="flex justify-between items-end mb-2">
                <span class="text-5xl font-black text-gray-700">LV. <span id="level-display">1</span></span>
                <span id="player-title" class="text-sm font-bold text-gray-400 uppercase">Seme</span>
            </div>
            <div class="w-full progress-bg h-2 mb-8 overflow-hidden">
                <div id="xp-bar" class="progress-fill h-full transition-all duration-700" style="width: 0%"></div>
            </div>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div class="stat-row"><span>Stabilità</span><span id="stb-val" class="font-bold">1</span></div>
                <div class="stat-row"><span>Flessibilità</span><span id="flx-val" class="font-bold">1</span></div>
                <div class="stat-row"><span>Dinamismo</span><span id="din-val" class="font-bold">1</span></div>
                <div class="stat-row"><span>Presenza</span><span id="cns-val" class="font-bold">1</span></div>
            </div>
        </div>

        <div id="cardio-panel" class="system-panel p-5 mb-6 border-dashed border-2" style="border-color: var(--zen-fire)">
            <h3 class="font-bold text-sm mb-3" style="color: var(--zen-fire)">IL CAMMINO DEL FUOCO (15 MIN CYCLETTE)</h3>
            <div id="cardio-content"></div>
        </div>

        <div class="system-panel p-6">
            <h2 class="system-header">Pratica Quotidiana (Fissa)</h2>
            <div id="quest-list" class="space-y-4"></div>
            <div class="mt-8">
                <button id="complete-quest-btn" onclick="finishDailyQuest()" class="btn-system w-full py-4 text-xl tracking-widest" disabled>CONCLUDI PRATICA</button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay" onclick="if(event.target===this) closeInfoModal()">
        <div class="system-alert !p-6">
            <h3 id="info-title" class="text-2xl font-bold text-gray-800 mb-4"></h3>
            <div class="bg-gray-50 p-5 rounded-xl text-left mb-6 text-gray-600 font-medium" id="info-desc"></div>
            <button onclick="closeInfoModal()" class="btn-system w-full py-3 rounded-full">RITORNA</button>
        </div>
    </div>

    <script>
        const STORAGE_PLAYER = 'zen_v4_light_player';
        const STORAGE_DAILY = 'zen_v4_light_daily';

        let player = { level: 1, xp: 0, xpToNext: 200, stats: { stb: 1, flx: 1, din: 1, cns: 1 } };
        let dailyProgress = { date: null, completed: false, exercises: {}, cyclette: { done: false } };

        const SEQUENZA_FISSA = [
            { 
                id: 'stb', name: "Posizione della Montagna", duration: 120, unit: "sec", 
                howTo: "In piedi, alluci uniti, talloni leggermente separati. Peso distribuito su tutta la pianta del piede. Braccia rilassate lungo i fianchi con i palmi rivolti in avanti. Spalle rilassate e lontane dalle orecchie. Sguardo dritto davanti a te.",
                baseDesc: "Allineamento piedi e colonna.", 
                advDesc: "Attivazione archi plantari e micro-sollevamento delle rotule." 
            },
            { 
                id: 'din', name: "Onda Spinale (Gatto-Mucca)", duration: 120, unit: "sec", 
                howTo: "Posizionati a 4 zampe (mani sotto le spalle, ginocchia sotto le anche). Inspirando, inarca la schiena verso il basso e guarda in alto (Mucca). Espirando, fai una gobba spingendo la colonna verso l'alto e guarda l'ombelico (Gatto).",
                baseDesc: "Flessione ed estensione fluida.", 
                advDesc: "Articolazione segmentale di ogni singola vertebra." 
            },
            { 
                id: 'flx', name: "Spirale di Luce (Semi-torsione)", duration: 180, unit: "sec x lato", 
                howTo: "Seduto a terra a gambe incrociate. Appoggia la mano destra dietro la schiena e la mano sinistra sul ginocchio opposto. Inspirando allunga la colonna verso l'alto, espirando ruota il busto verso destra guardando oltre la spalla. Ripeti dall'altro lato.",
                baseDesc: "Torsione dolce seduta.", 
                advDesc: "Espansione toracica ad ogni inspiro, radicamento glutei ad ogni espiro." 
            },
            { 
                id: 'flx2', name: "Radicamento (Ginocchio al Petto)", duration: 120, unit: "sec x gamba", 
                howTo: "Sdraiato a pancia in su. Mantieni la gamba sinistra tesa a terra e porta il ginocchio destro verso il petto, intrecciando le mani sulla tibia. Tira dolcemente verso di te rilassando le spalle. Cambia gamba.",
                baseDesc: "Rilascio lombare e anca.", 
                advDesc: "Compressione attiva e allungamento della gamba opposta." 
            },
            { 
                id: 'stb2', name: "Equilibrio Interiore (Albero)", duration: 90, unit: "sec x lato", 
                howTo: "In piedi, sposta il peso sulla gamba sinistra. Solleva il piede destro e appoggialo all'interno del polpaccio o della coscia sinistra (MAI sul ginocchio). Unisci le mani a preghiera davanti al petto.",
                baseDesc: "Fissare un punto immobile.", 
                advDesc: "Attivazione core profondo e sguardo interno." 
            },
            { 
                id: 'cns', name: "Abbandono Totale (Shavasana)", duration: 180, unit: "sec", 
                howTo: "Sdraiato a pancia in su. Braccia leggermente distanziate dal corpo con i palmi rivolti verso l'alto. Gambe rilassate con i piedi che cadono naturalmente verso l'esterno. Rilassa ogni singolo muscolo.",
                baseDesc: "Immobilità completa.", 
                advDesc: "Rilascio neurale e assorbimento della pratica." 
            }
        ];

        function getTechnicalCue(exercise) {
            let html = `<div class="mb-4"><span class="block font-black text-gray-800 mb-1 uppercase tracking-wider text-xs">Come si esegue:</span>${exercise.howTo}</div>`;
            html += `<div class="pt-3 border-t border-gray-200"><span class="block font-black text-[var(--zen-green)] mb-1 uppercase tracking-wider text-xs">Focus Livello Attuale:</span>`;
            
            if (player.level < 10) {
                html += exercise.baseDesc;
            } else if (player.level < 30) {
                html += `${exercise.baseDesc} <br><span class="font-bold text-[var(--zen-accent)]">Avanzato:</span> ${exercise.advDesc}`;
            } else {
                html += `${exercise.advDesc} <br><span class="font-bold text-[var(--zen-fire)]">Maestria:</span> Mantieni il respiro Ujjayi e attiva i Bandha profondi.`;
            }
            html += `</div>`;
            return html;
        }

        // Helper functions to avoid inline HTML syntax errors
        function showQuestInfo(id) {
            const ex = SEQUENZA_FISSA.find(e => e.id === id);
            if(ex) showInfo(ex.name, getTechnicalCue(ex));
        }

        function showCycletteInfo() {
            const desc = `<div class="mb-4"><span class="block font-black text-gray-800 mb-1 uppercase tracking-wider text-xs">Come si esegue:</span>Resistenza medio-bassa. Mantieni la schiena dritta e le spalle rilassate (appoggia a malapena le mani sul manubrio).<br><br>Il battito cardiaco deve salire, ma dovresti riuscire a respirare solo dal naso. Non alzarti sui pedali.</div>`;
            showInfo('Il Cammino del Fuoco', desc);
        }

        function showInfo(t, d) { 
            document.getElementById('info-title').innerText = t; 
            document.getElementById('info-desc').innerHTML = d; 
            document.getElementById('info-modal').classList.add('active'); 
        }

        function closeInfoModal() { document.getElementById('info-modal').classList.remove('active'); }

        // Timer Logic
        let activeInterval = null;
        let timerState = {};

        function startExerciseTimer(key, isCyclette = false) {
            if (activeInterval) return;
            const data = isCyclette ? dailyProgress.cyclette : dailyProgress.exercises[key];
            
            let duration = 0;
            let isTwoSided = false;

            if (isCyclette) {
                duration = 15 * 60; // 15 Minuti
            } else {
                const ex = SEQUENZA_FISSA.find(e => e.id === key);
                duration = ex.duration;
                isTwoSided = ex.unit.includes("x lato") || ex.unit.includes("x gamba");
            }

            timerState = { key, isCyclette, phase: 'prep', timeLeft: 3, target: duration, isTwoSided: isTwoSided };
            activeInterval = setInterval(tick, 1000);
            renderUI();
        }

        function tick() {
            timerState.timeLeft--;
            if (timerState.timeLeft <= 0) {
                if (timerState.phase === 'prep') {
                    document.getElementById('sfx-start-chime').play();
                    timerState.phase = 'run1'; timerState.timeLeft = timerState.target;
                } else if (timerState.phase === 'run1' && timerState.isTwoSided) {
                    document.getElementById('sfx-start-chime').play();
                    timerState.phase = 'prep2'; timerState.timeLeft = 3;
                } else if (timerState.phase === 'prep2') {
                    document.getElementById('sfx-start-chime').play();
                    timerState.phase = 'run2'; timerState.timeLeft = timerState.target;
                } else {
                    clearInterval(activeInterval); activeInterval = null;
                    completeEx(timerState.key, timerState.isCyclette);
                    return;
                }
            }
            updateTimerUI();
        }

        function completeEx(key, isCyc) {
            if(isCyc) dailyProgress.cyclette.done = true;
            else dailyProgress.exercises[key].done = true;
            document.getElementById('sfx-level-up').play();
            saveData(); renderUI();
        }

        function updateTimerUI() {
            const el = document.getElementById(`timer-display-${timerState.key}`);
            if (el) {
                if (timerState.phase.includes('prep')) {
                    el.innerText = `PREPARATI: ${timerState.timeLeft}s`;
                } else {
                    const m = Math.floor(timerState.timeLeft / 60).toString().padStart(2, '0');
                    const s = (timerState.timeLeft % 60).toString().padStart(2, '0');
                    el.innerText = `TEMPO: ${m}:${s}`;
                }
            }
        }

        function renderQuestList() {
            const list = document.getElementById('quest-list');
            list.innerHTML = '';
            SEQUENZA_FISSA.forEach(ex => {
                const data = dailyProgress.exercises[ex.id];
                const item = document.createElement('div');
                item.className = "bg-white p-4 border rounded-xl shadow-sm";
                if (timerState.key === ex.id && activeInterval) {
                    item.innerHTML = `<div class="font-bold text-center py-2" id="timer-display-${ex.id}">...</div>`;
                } else if (data.done) {
                    item.innerHTML = `<div class="flex justify-between font-bold text-green-600"><span>${ex.name}</span><i class="fas fa-check"></i></div>`;
                } else {
                    item.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-bold">${ex.name}</span>
                            <i class="fas fa-info-circle info-btn text-lg" onclick="showQuestInfo('${ex.id}')"></i>
                        </div>
                        <button onclick="startExerciseTimer('${ex.id}')" class="w-full py-2 border rounded-lg text-sm font-bold text-green-700 hover:bg-green-50 uppercase">Inizia (${ex.duration}s${ex.unit.includes('lato') || ex.unit.includes('gamba') ? ' a lato' : ''})</button>
                    `;
                }
                list.appendChild(item);
            });
            document.getElementById('complete-quest-btn').disabled = !SEQUENZA_FISSA.every(ex => dailyProgress.exercises[ex.id].done);
        }

        function renderCyclette() {
            const cont = document.getElementById('cardio-content');
            if (dailyProgress.cyclette.done) {
                cont.innerHTML = `<div class="text-center font-bold text-green-600">FORGIA COMPLETATA</div>`;
            } else if (timerState.key === 'cyclette' && activeInterval) {
                cont.innerHTML = `<div class="text-center py-2 font-bold" id="timer-display-cyclette">...</div>`;
            } else {
                cont.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold">Pedalata Rigenerante</span>
                        <i class="fas fa-info-circle info-btn text-lg" onclick="showCycletteInfo()"></i>
                    </div>
                    <button onclick="startExerciseTimer('cyclette', true)" class="w-full py-2 bg-white border border-red-200 text-red-500 rounded-lg font-bold">AVVIA 15 MIN</button>
                `;
            }
        }

        function checkDateLogic() {
            const today = new Date().toDateString();
            if (dailyProgress.date !== today) {
                dailyProgress.date = today; dailyProgress.completed = false; dailyProgress.cyclette.done = false;
                SEQUENZA_FISSA.forEach(ex => dailyProgress.exercises[ex.id] = { done: false });
                saveData();
            }
        }

        function finishDailyQuest() {
            dailyProgress.completed = true; player.xp += 100;
            if (player.xp >= player.xpToNext) { player.level++; player.xp = 0; Object.keys(player.stats).forEach(s => player.stats[s]++); }
            saveData(); renderUI();
            alert("Pratica conclusa. Il tuo corpo ha assimilato la maestria.");
        }

        function renderUI() {
            document.getElementById('level-display').innerText = player.level;
            document.getElementById('xp-bar').style.width = `${(player.xp/player.xpToNext)*100}%`;
            Object.keys(player.stats).forEach(s => document.getElementById(`${s}-val`).innerText = player.stats[s]);
            if (dailyProgress.completed) {
                document.getElementById('quest-list').innerHTML = `<div class="text-center py-10 font-bold text-gray-400 uppercase">Pratica Completata. Riposa.</div>`;
                document.getElementById('complete-quest-btn').classList.add('hidden');
            } else {
                renderQuestList(); renderCyclette();
            }
        }

        function saveData() { localStorage.setItem(STORAGE_PLAYER, JSON.stringify(player)); localStorage.setItem(STORAGE_DAILY, JSON.stringify(dailyProgress)); }
        function loadData() {
            const p = localStorage.getItem(STORAGE_PLAYER); const d = localStorage.getItem(STORAGE_DAILY);
            if (p) player = JSON.parse(p); if (d) dailyProgress = JSON.parse(d);
        }
        function toggleSettings() { document.getElementById('settings-panel').classList.toggle('hidden'); }
        function exportData() { 
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({player, dailyProgress}));
            const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "zen_mastery.json"); dl.click();
        }

        loadData(); checkDateLogic(); renderUI();
    </script>
</body>
</html>
